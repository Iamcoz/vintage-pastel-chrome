<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>새 탭 옵션</title>
<style>
  body { margin: 0; padding: 20px 24px; font-family: system-ui, "Apple SD Gothic Neo", sans-serif; font-size: 14px; color: #233247; min-width: 280px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  label { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; }
  .chip { width: 64px; height: 22px; border-radius: 11px; flex: none; }
  .pink { background: #E9B3BA; }
  .glass { background: #B7CBA9 linear-gradient(rgba(239,236,220,.35), rgba(239,236,220,.35)); box-shadow: inset 0 1px 0 rgba(242,230,238,.6); }
</style>
</head>
<body>
  <h1>검색창 모양</h1>
  <label><input type="radio" name="style" value="pink"><span class="chip pink"></span>분홍(툴바와 같은 색)</label>
  <label><input type="radio" name="style" value="glass"><span class="chip glass"></span>투명</label>
  <script src="options.js"></script>
</body>
</html>
